<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum relativity, live</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07090d;
    --panel: rgba(16, 20, 28, 0.92);
    --line: #263040;
    --text: #dfe6ef;
    --muted: #8593a6;
    --accent: #5b8cff;
    --warn: #ff7a45;
    --dot: #cfd8e3;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --panel: rgba(255, 255, 255, 0.94);
      --line: #d5dbe4;
      --text: #18202b;
      --muted: #5c6878;
      --accent: #2f5fd8;
      --warn: #c4461a;
      --dot: #2a3340;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  #hint { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  #panel { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 310px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; overflow-y: auto; backdrop-filter: blur(6px); transition: transform .2s ease; }
  #panel.collapsed { transform: translateX(calc(100% + 24px)); }
  #toggle { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 2; }
  #panel:not(.collapsed) ~ #toggle { right: 334px; }
  h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 16px 0 6px; font-weight: 600; }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 80px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { color: var(--muted); font-size: 12px; }
  input[type=number] { width: 78px; font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .setting { margin: 8px 0; }
  .setting .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .setting .value { color: var(--muted); font-variant-numeric: tabular-nums; }
  .setting input { width: 100%; margin: 2px 0 0; accent-color: var(--accent); }
  #stats div { font-variant-numeric: tabular-nums; }
  #stats span { color: var(--muted); }
  #legend { height: 8px; border-radius: 4px; margin: 4px 0 2px;
    background: linear-gradient(90deg, rgb(51,102,242), rgb(170,150,200), rgb(255,90,40)); }
  .legend-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  #state { color: var(--muted); font-size: 12px; margin-left: auto; }
  #offline { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; padding: 0 16px; }
  #offline div { background: var(--panel); border: 1px solid var(--warn); border-radius: 10px;
    padding: 14px 18px; max-width: 420px; text-align: center; }
  #offline code { color: var(--warn); }
  @media (max-width: 700px) {
    #panel:not(.collapsed) ~ #toggle { right: 12px; top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hint">
  <button id="fit" type="button">fit</button>
  <span>drag to rotate, wheel or pinch to zoom, double-click to recentre</span>
</div>

<aside id="panel">
  <h1>Quantum relativity</h1>
  <div class="row">
    <button id="run" class="primary" type="button">Start</button>
    <span id="state">paused</span>
  </div>

  <h2>Reset</h2>
  <div class="row">
    <label for="seed">seed</label><input id="seed" type="number" value="1" step="1">
    <label for="jointCount">joints</label><input id="jointCount" type="number" value="300" min="2" step="1">
  </div>
  <div class="row" style="margin-top:8px"><button id="reset" type="button">Reset</button></div>

  <h2>Now</h2>
  <div id="stats"><div><span>waiting for the simulation</span></div></div>

  <h2>Energy on a connection</h2>
  <div id="legend"></div>
  <div class="legend-ends"><span>low</span><span>high</span></div>
  <div class="row" style="margin-top:8px">
    <label><input id="showJoints" type="checkbox" checked> show joints</label>
  </div>

  <h2>Run</h2>
  <div id="runSettings"></div>
  <h2>Rules</h2>
  <div id="ruleSettings"><div style="color:var(--muted)">settings arrive once connected</div></div>
</aside>
<button id="toggle" type="button">controls</button>

<div id="offline" hidden>
  <div id="offlineText">connecting...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

/* ---------- plain-word labels for the server's setting names ---------- */
const LABELS = {
  speed: "speed (steps per second)",
  unevenness: "starting unevenness of energy",
  energy_length: "energy keeps length matched",
  energy_flow: "energy flow between neighbours",
  drift: "drift (all space stretches)",
  attraction: "attraction (gravity strength)",
  joint_push: "joint push",
  push_limit: "push limit before a joint collapses",
  repulsion: "joint repulsion",
  rewiring: "rewiring moves per step",
  target_degree: "connections per joint (aim)",
  target_triangles: "triangles per joint (aim)",
  triangle_weight: "triangles against connections",
};
const RUN_SETTINGS = new Set(["speed", "unevenness"]);
const INTEGER_SETTINGS = new Set(["rewiring"]);

/* ---------- three.js scene ---------- */
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.001, 1e6);

const lineGeometry = new THREE.BufferGeometry();
const lineMaterial = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9 });
const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
lines.frustumCulled = false;
scene.add(lines);

const jointGeometry = new THREE.BufferGeometry();
const jointMaterial = new THREE.PointsMaterial({ size: 4, sizeAttenuation: false,
  map: roundDotTexture(), alphaTest: 0.5, transparent: true });
const jointPoints = new THREE.Points(jointGeometry, jointMaterial);
jointPoints.frustumCulled = false;
scene.add(jointPoints);

/** Return a small white disc texture so points draw as round dots. */
function roundDotTexture() {
  const dotCanvas = document.createElement("canvas");
  dotCanvas.width = dotCanvas.height = 32;
  const context = dotCanvas.getContext("2d");
  context.fillStyle = "#fff";
  context.beginPath();
  context.arc(16, 16, 14, 0, Math.PI * 2);
  context.fill();
  return new THREE.CanvasTexture(dotCanvas);
}

/* ---------- mesh state: buffers resized only when a mesh message arrives ---------- */
const mesh = {
  jointCount: 0,
  pairs: new Uint32Array(0),     // i0, j0, i1, j1, ...
  linePositions: new Float32Array(0),
  lineColors: new Float32Array(0),
  jointPositions: new Float32Array(0),
  hasFrame: false,
};

/** Install a new connection list: reallocate buffers only when capacity grows. */
function applyMesh(message) {
  const pairCount = Math.floor(message.pairs.length / 2);
  mesh.jointCount = message.joints;
  mesh.pairs = Uint32Array.from(message.pairs);
  if (mesh.linePositions.length < pairCount * 6) {
    mesh.linePositions = new Float32Array(pairCount * 6);
    mesh.lineColors = new Float32Array(pairCount * 6);
    lineGeometry.setAttribute("position", new THREE.BufferAttribute(mesh.linePositions, 3));
    lineGeometry.setAttribute("color", new THREE.BufferAttribute(mesh.lineColors, 3));
  }
  if (mesh.jointPositions.length < mesh.jointCount * 3) {
    mesh.jointPositions = new Float32Array(mesh.jointCount * 3);
    jointGeometry.setAttribute("position", new THREE.BufferAttribute(mesh.jointPositions, 3));
  }
  lineGeometry.setDrawRange(0, mesh.hasFrame ? pairCount * 2 : 0);
  jointGeometry.setDrawRange(0, mesh.hasFrame ? mesh.jointCount : 0);
}

const LOW = [0.20, 0.40, 0.95], MID = [0.67, 0.59, 0.78], HIGH = [1.0, 0.35, 0.16];

/** Write the energy colour for a 0..1 level into `target` at `offset`. */
function energyColor(level, target, offset) {
  const clamped = Math.min(1, Math.max(0, level || 0));
  const [from, to, part] = clamped < 0.5 ? [LOW, MID, clamped * 2] : [MID, HIGH, clamped * 2 - 1];
  for (let channel = 0; channel < 3; channel++) {
    target[offset + channel] = from[channel] + (to[channel] - from[channel]) * part;
  }
}

/** Copy one frame's positions and energies into the existing buffers. */
function applyFrame(message) {
  const positions = message.positions, energy = message.energy;
  if (!positions || positions.length !== mesh.jointCount * 3) return false;
  const pairCount = mesh.pairs.length / 2;
  mesh.jointPositions.set(positions);
  for (let pair = 0; pair < pairCount; pair++) {
    const from = mesh.pairs[pair * 2] * 3, to = mesh.pairs[pair * 2 + 1] * 3, out = pair * 6;
    mesh.linePositions[out] = positions[from];
    mesh.linePositions[out + 1] = positions[from + 1];
    mesh.linePositions[out + 2] = positions[from + 2];
    mesh.linePositions[out + 3] = positions[to];
    mesh.linePositions[out + 4] = positions[to + 1];
    mesh.linePositions[out + 5] = positions[to + 2];
    const level = energy && pair < energy.length ? energy[pair] : 0;
    energyColor(level, mesh.lineColors, out);
    mesh.lineColors[out + 3] = mesh.lineColors[out];
    mesh.lineColors[out + 4] = mesh.lineColors[out + 1];
    mesh.lineColors[out + 5] = mesh.lineColors[out + 2];
  }
  lineGeometry.attributes.position.needsUpdate = true;
  lineGeometry.attributes.color.needsUpdate = true;
  jointGeometry.attributes.position.needsUpdate = true;
  lineGeometry.setDrawRange(0, pairCount * 2);
  jointGeometry.setDrawRange(0, mesh.jointCount);
  mesh.hasFrame = true;
  return true;
}

/* ---------- camera: orbit around a target, never auto-fit per frame ---------- */
const orbit = { target: new THREE.Vector3(), distance: 10, azimuth: 0.6, elevation: 0.4 };

/** Place the camera from the orbit state. */
function placeCamera() {
  const cosElevation = Math.cos(orbit.elevation);
  camera.position.set(
    orbit.target.x + orbit.distance * cosElevation * Math.sin(orbit.azimuth),
    orbit.target.y + orbit.distance * Math.sin(orbit.elevation),
    orbit.target.z + orbit.distance * cosElevation * Math.cos(orbit.azimuth));
  camera.near = orbit.distance / 1000;
  camera.far = orbit.distance * 1000;
  camera.updateProjectionMatrix();
  camera.lookAt(orbit.target);
  requestDraw();
}

/** Move the orbit target to the centre of the joints; return their largest distance from it. */
function recentre() {
  const count = mesh.jointCount, points = mesh.jointPositions;
  if (!mesh.hasFrame || count === 0) return 0;
  let sumX = 0, sumY = 0, sumZ = 0;
  for (let joint = 0; joint < count; joint++) {
    sumX += points[joint * 3]; sumY += points[joint * 3 + 1]; sumZ += points[joint * 3 + 2];
  }
  orbit.target.set(sumX / count, sumY / count, sumZ / count);
  let radius = 0;
  for (let joint = 0; joint < count; joint++) {
    const dx = points[joint * 3] - orbit.target.x, dy = points[joint * 3 + 1] - orbit.target.y,
      dz = points[joint * 3 + 2] - orbit.target.z;
    radius = Math.max(radius, Math.sqrt(dx * dx + dy * dy + dz * dz));
  }
  placeCamera();
  return radius;
}

/** Recentre and zoom so the whole network fills the view. */
function fit() {
  const radius = recentre();
  if (radius > 0) {
    orbit.distance = radius / Math.sin((camera.fov * Math.PI / 180) / 2) * 1.05;
    placeCamera();
  }
}

const pointers = new Map();
let pinchStart = 0, pinchDistance = 0;

/** Return the distance between the first two active pointers. */
function pointerSpread() {
  const [first, second] = [...pointers.values()];
  return Math.hypot(first.x - second.x, first.y - second.y);
}

canvas.addEventListener("pointerdown", (event) => {
  canvas.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  canvas.classList.add("dragging");
  if (pointers.size === 2) { pinchStart = pointerSpread(); pinchDistance = orbit.distance; }
});
canvas.addEventListener("pointermove", (event) => {
  const previous = pointers.get(event.pointerId);
  if (!previous) return;
  const dx = event.clientX - previous.x, dy = event.clientY - previous.y;
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (pointers.size === 1) {
    orbit.azimuth -= dx * 0.008;
    orbit.elevation = Math.max(-1.55, Math.min(1.55, orbit.elevation + dy * 0.008));
  } else if (pointers.size === 2 && pinchStart > 0) {
    orbit.distance = pinchDistance * pinchStart / Math.max(1, pointerSpread());
  }
  placeCamera();
});
for (const name of ["pointerup", "pointercancel"]) {
  canvas.addEventListener(name, (event) => {
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinchStart = 0;
    if (pointers.size === 0) canvas.classList.remove("dragging");
  });
}
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  orbit.distance *= Math.exp(event.deltaY * 0.0012);
  placeCamera();
}, { passive: false });
canvas.addEventListener("dblclick", () => recentre());
document.getElementById("fit").addEventListener("click", fit);

/* ---------- drawing ---------- */
let drawPending = false;

/** Ask for one redraw on the next animation frame. */
function requestDraw() {
  if (drawPending) return;
  drawPending = true;
  requestAnimationFrame(() => { drawPending = false; renderer.render(scene, camera); });
}

/** Match renderer size and camera aspect to the window. */
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
  camera.updateProjectionMatrix();
  requestDraw();
}

/** Read the page's theme colours into the scene. */
function applyTheme() {
  const style = getComputedStyle(document.documentElement);
  scene.background = new THREE.Color(style.getPropertyValue("--bg").trim());
  jointMaterial.color = new THREE.Color(style.getPropertyValue("--dot").trim());
  requestDraw();
}

window.addEventListener("resize", resize);
window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);
document.getElementById("showJoints").addEventListener("change", (event) => {
  jointPoints.visible = event.target.checked;
  requestDraw();
});

/* ---------- panel ---------- */
const panel = document.getElementById("panel");
const runButton = document.getElementById("run");
const stateLabel = document.getElementById("state");
let running = false, lastStep = -1, fitOnNextFrame = true;

if (window.innerWidth <= 700) panel.classList.add("collapsed");
document.getElementById("toggle").addEventListener("click", () => panel.classList.toggle("collapsed"));

/** Show whether the simulation runs, on the button and the label. */
function setRunning(value) {
  running = value;
  runButton.textContent = running ? "Pause" : "Start";
  stateLabel.textContent = running ? "running" : "paused";
}

runButton.addEventListener("click", () => {
  send({ type: running ? "pause" : "start" });
  setRunning(!running);
});
document.getElementById("reset").addEventListener("click", () => {
  const seed = parseInt(document.getElementById("seed").value, 10) || 0;
  const joints = Math.max(2, parseInt(document.getElementById("jointCount").value, 10) || 2);
  send({ type: "reset", seed, joints });
  setRunning(false);
  lastStep = -1;
  fitOnNextFrame = true;
});

/** Format a number short and readable. */
function formatNumber(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "n/a";
  if (!Number.isFinite(value)) return "no limit";
  const size = Math.abs(value);
  if (value !== 0 && (size >= 1e5 || size < 1e-3)) return value.toExponential(2);
  if (Number.isInteger(value)) return String(value);
  return String(parseFloat(value.toPrecision(3)));
}

const statsBox = document.getElementById("stats");

/** Write the live stats as plain lines. */
function showStats(step, stats) {
  const lines = [
    ["step", step],
    ["joints", stats.joints],
    ["collapses", stats.collapsed],
    ["size vs start", stats.mean_length_vs_start == null ? undefined : formatNumber(stats.mean_length_vs_start) + "x"],
    ["energy spread", stats.energy_spread],
    ["lumps", stats.lumps],
  ];
  statsBox.replaceChildren(...lines.map(([label, value]) => {
    const line = document.createElement("div");
    const name = document.createElement("span");
    name.textContent = label + " ";
    line.append(name, typeof value === "string" ? value : formatNumber(value));
    return line;
  }));
}

const sliders = new Map();   // name -> {input, valueLabel, spec, log}
let activeSlider = null;

/** Map a slider position 0..1000 to a setting value. */
function sliderToValue(entry, position) {
  const { min, max } = entry.spec, part = position / 1000;
  let value = entry.log ? min * Math.pow(max / min, part) : min + (max - min) * part;
  if (entry.integer) value = Math.round(value);
  return value;
}

/** Map a setting value to a slider position 0..1000. */
function valueToSlider(entry, value) {
  const { min, max } = entry.spec;
  const clamped = Math.min(max, Math.max(min, Number.isFinite(value) ? value : max));
  const part = entry.log ? Math.log(clamped / min) / Math.log(max / min) : (clamped - min) / ((max - min) || 1);
  return Math.round(part * 1000);
}

/** Build one labelled slider for a setting and register it. */
function buildSlider(name, spec, container) {
  const wrap = document.createElement("div");
  wrap.className = "setting";
  const top = document.createElement("div");
  top.className = "top";
  const label = document.createElement("span");
  label.textContent = LABELS[name] || name.replace(/_/g, " ");
  const valueLabel = document.createElement("span");
  valueLabel.className = "value";
  top.append(label, valueLabel);
  const input = document.createElement("input");
  input.type = "range"; input.min = "0"; input.max = "1000"; input.step = "1";
  input.setAttribute("aria-label", label.textContent);
  wrap.append(top, input);
  container.append(wrap);
  const entry = { input, valueLabel, spec,
    log: spec.min > 0 && spec.max / spec.min >= 100,
    integer: INTEGER_SETTINGS.has(name) ||
      (Number.isInteger(spec.min) && Number.isInteger(spec.max) && Number.isInteger(spec.value) && spec.max - spec.min >= 10) };
  let sendTimer = 0;
  input.addEventListener("pointerdown", () => { activeSlider = name; });
  input.addEventListener("input", () => {
    const value = sliderToValue(entry, Number(input.value));
    valueLabel.textContent = formatNumber(value);
    clearTimeout(sendTimer);
    sendTimer = setTimeout(() => send({ type: "settings", values: { [name]: value } }), 80);
  });
  input.addEventListener("change", () => { activeSlider = null; });
  sliders.set(name, entry);
  return entry;
}

/** Build or refresh every slider from a settings message. */
function applySettings(values) {
  const names = Object.keys(values);
  const sameSet = names.length === sliders.size && names.every((name) => sliders.has(name));
  if (!sameSet) {
    sliders.clear();
    const runBox = document.getElementById("runSettings"), ruleBox = document.getElementById("ruleSettings");
    runBox.replaceChildren(); ruleBox.replaceChildren();
    for (const name of names) buildSlider(name, values[name], RUN_SETTINGS.has(name) ? runBox : ruleBox);
  }
  for (const name of names) {
    const entry = sliders.get(name);
    entry.spec = values[name];
    if (name === activeSlider) continue;
    entry.input.value = String(valueToSlider(entry, entry.spec.value));
    entry.valueLabel.textContent = formatNumber(entry.spec.value);
  }
}

/* ---------- connection ---------- */
const offline = document.getElementById("offline");
const offlineText = document.getElementById("offlineText");
let socket = null, retryDelay = 1000, everConnected = false;

/** Send one message if the socket is open. */
function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

/** Return the WebSocket address for this page's server. */
function socketAddress() {
  const host = location.host || "localhost:8765";
  return (location.protocol === "https:" ? "wss://" : "ws://") + host + "/ws";
}

/** Show the not-connected notice. */
function showOffline() {
  offlineText.innerHTML = everConnected
    ? "Connection lost, retrying.<br>If the server stopped, start it with <code>python -m physics.app</code>"
    : "Not connected: start it with <code>python -m physics.app</code><br>Retrying on its own.";
  offline.hidden = false;
}

/** Route one server message to its handler. */
function handleMessage(message) {
  if (message.type === "mesh") {
    applyMesh(message);
    requestDraw();
  } else if (message.type === "frame") {
    if (!applyFrame(message)) return;
    if (message.step > lastStep && lastStep >= 0 && !running) setRunning(true);
    lastStep = message.step;
    showStats(message.step, message.stats || {});
    if (fitOnNextFrame) { fitOnNextFrame = false; fit(); }
    requestDraw();
  } else if (message.type === "settings") {
    applySettings(message.values || {});
  }
}

/** Open the socket and keep retrying until the server answers. */
function connect() {
  socket = new WebSocket(socketAddress());
  socket.addEventListener("open", () => {
    everConnected = true;
    retryDelay = 1000;
    offline.hidden = true;
    setRunning(false);
    lastStep = -1;
    fitOnNextFrame = true;
  });
  socket.addEventListener("message", (event) => {
    let message;
    try { message = JSON.parse(event.data); } catch (error) { console.warn("bad message", error); return; }
    handleMessage(message);
  });
  socket.addEventListener("close", () => {
    showOffline();
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 1.5, 5000);
  });
}

resize();
applyTheme();
placeCamera();
connect();
</script>
</body>
</html>
