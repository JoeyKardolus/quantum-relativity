[project]
name = "physics"
version = "0"
description = "Quantum-relativity theory simulation: the foam as an energy fluid on a GPU grid, and its viewer."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "warp-lang>=1.9", "pyglet>=2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["physics"]
package-dir = { "physics" = "." }
